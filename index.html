<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("payload").textContent);
  var GAMES = DATA.games;
  var COLS = DATA.columns;

  /* 列 key -> [格式化函数, 空值时的附加 class] */
  var FORMATTERS = {
    downloads: [fmtWan, "zero"],
    new_downloads: [fmtDelta, "delta"],
    prev_downloads: [fmtWan, "zero"],
    fans: [fmtWan, null],
    rating: [fmtFloat, null],
    reviews: [fmtInt, null],
    release: [function (v) { return v || "-"; }, null],
    refresh: [function (v) { return v || "-"; }, "zero"]
  };

  var tbody = document.querySelector("#games tbody");
  var countEl = document.getElementById("count");
  var searchEl = document.getElementById("search");

  /* 深浅色：跟随系统，手动切换后记住 */
  var root = document.documentElement;
  var saved = null;
  try { saved = localStorage.getItem("cfg-theme"); } catch (e) {}
  if (saved) {
    root.setAttribute("data-theme", saved);
  } else {
    root.setAttribute("data-theme",
      window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  document.getElementById("theme").addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("cfg-theme", next); } catch (e) {}
  });

  /* 数值统一走这里：非数值（如「抓取失败」）原样显示，不要套数字格式 */
  function fmtInt(n) {
    if (n === null || n === undefined) return "-";
    return typeof n === "number" ? n.toLocaleString("en-US") : String(n);
  }
  function fmtFloat(n) { return n === null || n === undefined ? "-" : String(n); }
  /* 下载量/关注量以「万次」展示，保留两位小数（单位写在表头里） */
  function fmtWan(n) {
    if (n === null || n === undefined) return "-";
    return typeof n === "number" ? (n / 10000).toFixed(2) + "万" : String(n);
  }
  /* 当日新增下载：保留原始单位（次），增量通常远小于总量，换算成万会看不见 */
  function fmtDelta(n) {
    if (n === null || n === undefined) return "-";
    if (typeof n !== "number") return String(n);
    return (n > 0 ? "+" : "") + n.toLocaleString("en-US");
  }

  /* 排序。空值永远沉底：判断放在比较器外面做，否则升降序取反会把它翻回顶部。 */
  var sortKey = "downloads", sortDir = "desc";
  function isEmpty(v) { return v === null || v === undefined || v === ""; }
  function cmpNonEmpty(a, b) {
    var va = a[sortKey], vb = b[sortKey];
    if (typeof va === "number" && typeof vb === "number") return va - vb;
    return String(va).localeCompare(String(vb), "zh-Hans-CN");
  }

  function filtered() {
    var q = searchEl.value.trim().toLowerCase();
    var rows = GAMES;
    if (q) {
      rows = GAMES.filter(function (g) {
        return (g.name + " " + (g.tags || "")).toLowerCase().indexOf(q) !== -1;
      });
    }
    var out = rows.slice();
    out.sort(function (a, b) {
      var na = isEmpty(a[sortKey]), nb = isEmpty(b[sortKey]);
      if (na || nb) return na && nb ? 0 : (na ? 1 : -1);
      return sortDir === "asc" ? cmpNonEmpty(a, b) : cmpNonEmpty(b, a);
    });
    return out;
  }

  function render() {
    var rows = filtered();
    var frag = document.createDocumentFragment();
    rows.forEach(function (g, i) {
      var tr = document.createElement("tr");

      var tdName = document.createElement("td");
      tdName.className = "name";
      if (g.url) {
        var a = document.createElement("a");
        a.href = g.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = g.name;
        a.title = g.name;
        tdName.appendChild(a);
      } else {
        tdName.textContent = g.name;
      }
      tr.appendChild(tdName);

      /* 按前端拿到的列定义逐列渲染：列数会随「刷新状态」列的有无而变，
         行里写死字段顺序会导致表头与内容错位 */
      COLS.slice(1).forEach(function (col) {  // 第 0 列是游戏名称，单独处理
        var spec = FORMATTERS[col.key] || [function (v) { return v || "-"; }, null];
        var td = document.createElement("td");
        var raw = g[col.key];
        /* 只有数值列右对齐。文本列（标签、发布日期…）一律左对齐——
           之前给所有列都加了 .num，标签列被右对齐又被 max-width 截断 */
        var numeric = (col.kind === "int" || col.kind === "float" || col.kind === "delta");
        td.className = (numeric ? "num" : "txt")
          + (col.key === "tags" ? " tags" : "")      /* td.tags 那条样式要靠这个 class 才生效 */
          + (spec[1] && !raw ? " " + spec[1] : "")
          + (raw === "抓取失败" ? " failed" : "");   /* 只有真失败才淡化，别把普通字符串也算上 */
        /* 新增下载列：正负加方向颜色，配合 +/- 号双重表意 */
        if (col.key === "new_downloads" && typeof raw === "number" && spec[1] !== "zero") {
          td.className += raw > 0 ? " up" : (raw < 0 ? " down" : "");
        }
        td.textContent = spec[0](raw);
        if (col.key === "tags") { td.title = raw || ""; }
        tr.appendChild(td);
      });

      frag.appendChild(tr);
    });
    tbody.replaceChildren(frag);
    countEl.textContent = rows.length === GAMES.length
      ? GAMES.length + " 个游戏"
      : rows.length + " / " + GAMES.length + " 个游戏";
  }

  function setSort(key) {
    if (sortKey === key) {
      sortDir = sortDir === "desc" ? "asc" : "desc";
    } else {
      sortKey = key;
      sortDir = "desc";
    }
    Array.prototype.forEach.call(document.querySelectorAll("th"), function (th) {
      th.setAttribute("aria-sort", th.dataset.key === sortKey
        ? (sortDir === "desc" ? "descending" : "ascending") : "none");
    });
    render();
  }

  Array.prototype.forEach.call(document.querySelectorAll("th"), function (th) {
    th.addEventListener("click", function () { setSort(th.dataset.key); });
    th.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setSort(th.dataset.key); }
    });
  });

  searchEl.addEventListener("input", render);
  render();
})();
</script>
</body>
